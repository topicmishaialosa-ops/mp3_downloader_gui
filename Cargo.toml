[package]
name = "mp3_downloader_gui"
version = "1.19.3"
edition = "2021"

[dependencies]
eframe = "0.29.1"
reqwest = { version = "0.12", features = ["blocking", "cookies", "json"] }
scraper = "0.20.0"
regex = "1"
urlencoding = "2.1.3"
rfd = "0.15"
serde_json = "1"
rodio = { version = "0.19", default-features = false, features = ["mp3", "vorbis", "flac", "wav"] }
rand = "0.8"
base64 = "0.22"
percent-encoding = "2"

name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: mp3_downloader_gui-linux-x86_64
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            name: mp3_downloader_gui-windows-x86_64.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            name: mp3_downloader_gui-macos-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install deps (Linux)
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libasound2-dev libudev-dev

      - name: Install deps (Windows cross)
        if: contains(matrix.target, 'windows')
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 mingw-w64-tools
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/mp3_downloader_gui${{ contains(matrix.target, 'windows') && '.exe' || '' }}

  build-qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-multimedia-dev libqt6multimedia6 libqt6multimediawidgets6 cmake g++

      - name: Build Qt
        run: |
          cmake -B qt/build -S qt -DCMAKE_BUILD_TYPE=Release
          cmake --build qt/build --parallel

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mp3_downloader_gui_qt-linux-x86_64
          path: qt/build/mp3_downloader_gui_qt

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" > /dev/null 2>&1

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mp3_downloader_gui-android.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  create-release:
    needs: [build-rust, build-qt, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && success()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" \
            --title "mp3 downloader gui ${VERSION}" \
            --notes "Автоматическая сборка от $(date)"
          sleep 5
          for dir in */; do
            name="${dir%/}"
            file=$(find "$dir" -type f)
            [ -n "$file" ] && mv "$file" "$dir/$name" && gh release upload "$TAG" "$dir/$name" --clobber
          done

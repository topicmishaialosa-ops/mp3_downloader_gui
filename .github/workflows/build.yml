name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: mp3_downloader_gui-linux-x86_64
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            name: mp3_downloader_gui-windows-x86_64.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            name: mp3_downloader_gui-macos-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install deps (Linux)
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libasound2-dev libudev-dev

      - name: Install deps (Windows cross)
        if: contains(matrix.target, 'windows')
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 mingw-w64-tools
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/mp3_downloader_gui${{ contains(matrix.target, 'windows') && '.exe' || '' }}

  create-release:
    needs: build-rust
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && success()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(grep '^version' Cargo.toml | head -1 | cut -d'\"' -f2)-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" \
            mp3_downloader_gui-*/* \
            --title "Build $TAG" \
            --notes "Автоматическая сборка от $(date)" \
            --generate-notes
